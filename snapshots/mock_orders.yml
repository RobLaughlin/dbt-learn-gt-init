snapshots:
  - name: orders_snapshot
    relation: source('raw_jaffle_shop', 'orders')
    config:
      schema: snapshots
      database: dbt-learn-499019
      unique_key: id
      strategy: check
      check_cols: ["id", "user_id", "order_date", "status"]
      hard_deletes: ignore
      dbt_valid_to_current: "TIMESTAMP('9999-12-31 00:00:00 UTC')"
