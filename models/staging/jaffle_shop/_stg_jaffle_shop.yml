models:
  - name: stg_jaffle_shop__customers
    description: One unique customer per row
    columns:
      - name: customer_id
        description: Unique customer ID
        data_tests:
          - unique
          - not_null
      - name: first_name
        data_tests:
          - not_null
      - name: last_name
        data_tests:
          - not_null

  - name: stg_jaffle_shop__orders
    description: One unique order per row

    columns:
      - name: order_id
        description: Unique order ID
        data_tests:
          - unique
          - not_null

      - name: customer_id
        description: customer_id may not be unique, may be multiple orders from one customer
        data_tests:
          - not_null

          # This test now fails since we added arbitrary order values
          #- relationships:
          #  arguments:
          #    to: ref('stg_jaffle_shop__customers')
          #    field: customer_id  #}

      - name: order_date
        description: Date when order was placed
        data_tests:
          - not_null:
              config:
                severity: warn

      - name: status
        description: '{{ doc("order_status") }}'

data_tests:
  - name: assert_stg_jaffle_shop__orders_no_invalid_order_statuses
    description: "Warn if there are any invalid order statuses"
    config:
      severity: warn
      store_failures: true
