models:
  - name: stg_stripe__payment
    description: "Unique payment per row"
    columns:
      - name: payment_id
        data_type: number
        description: "Unique payment ID"
        data_tests:
          - not_null
          - unique

      - name: order_id
        data_type: number
        description: "Order ID, can have multiple payments per order"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: '{{ ref("stg_jaffle_shop__orders") }}'
                field: order_id

      - name: payment_method
        data_type: varchar
        description: "Payment method used"
        data_tests:
          - not_null

      - name: status
        data_type: varchar
        description: "Payment status"
        data_tests:
          - not_null

      - name: amount_usd
        data_type: number
        description: "The amount of the payment made, in USD"
        data_tests:
          - not_null

      - name: created_at
        data_type: date
        description: "The date that the payment was created at"
        data_tests:
          - not_null

      - name: _batched_at
        data_type: timestamp_ntz
        description: "The timestamp the stripe data was batched at"

data_tests:
  - name: assert_stg_stripe__payment_no_invalid_payment_statuses
    description: "Warn if there are any invalid payment statuses"
    config:
      severity: warn
      store_failures: true

  - name: assert_stg_stripe__payment_no_invalid_payment_methods
    description: "Warn if there are any invalid payment methods"
    config:
      severity: warn
      store_failures: true
